<!doctype html>
<!-- Used for debugging -->
<html>
  <head>
    <meta charset="UTF-8" />
    <title>webview harness</title>
    <style>
      /* The stylesheet VS Code injects into a webview's content frame, from
       * `defaultStyles` in out/vs/workbench/contrib/webview/browser/pre/index.html.
       * Without it the harness is more forgiving than a real webview and host
       * rules that leak into the editor (scrollbars especially) look fine here
       * and wrong in VS Code. Keep the @layer and the inherited scrollbar-color:
       * together they are what makes the ::-webkit-scrollbar-* rules below inert.
       * The --vscode-* values stand in for a dark workbench theme, so a mismatch
       * with a light editor theme is obvious on sight. */
      :root {
        --vscode-editor-background: #002b36;
        --vscode-editor-foreground: #839496;
        --vscode-scrollbarSlider-background: #2aa19899;
        --vscode-scrollbarSlider-hoverBackground: #2aa198cc;
        --vscode-scrollbarSlider-activeBackground: #2aa198;
      }

      @layer vscode-default {
        html {
          scrollbar-color: var(--vscode-scrollbarSlider-background) var(--vscode-editor-background);
        }

        body {
          margin: 0;
          background-color: var(--vscode-editor-background);
          color: var(--vscode-editor-foreground);
        }

        ::-webkit-scrollbar {
          width: 10px;
          height: 10px;
        }

        ::-webkit-scrollbar-corner {
          background-color: var(--vscode-editor-background);
        }

        ::-webkit-scrollbar-thumb {
          background-color: var(--vscode-scrollbarSlider-background);
        }
        ::-webkit-scrollbar-thumb:hover {
          background-color: var(--vscode-scrollbarSlider-hoverBackground);
        }
        ::-webkit-scrollbar-thumb:active {
          background-color: var(--vscode-scrollbarSlider-activeBackground);
        }
      }
    </style>
  </head>
  <body class="vscode-dark">
    <div id="app"></div>
    <script>
      // Mock the VS Code webview API so we can exercise the message protocol.
      window.__posted = [];
      window.acquireVsCodeApi = () => ({
        postMessage: (m) => {
          window.__posted.push(m);
        },
        getState: () => undefined,
        setState: () => undefined,
      });
      window.__send = (m) => window.dispatchEvent(new MessageEvent("message", { data: m }));
    </script>
    <script type="module" src="./dist/webview.js"></script>
  </body>
</html>
