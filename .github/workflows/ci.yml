name: Tests and deployment
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: ✅ Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: vp i
      - name: Run tests
        run: vp test
      - name: Run benchmark
        run: node packages/typodown/tests/benchmark/run.mjs
        env:
          BENCH_OUTPUT_DIR: benchmark-results
          CHROMIUM_PATH: /usr/bin/google-chrome
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: benchmark-results
          retention-days: 30

  deploy:
    name: ⚡️ Deploy to GitHub Pages
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: npm
      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0

      - name: Install dependencies
        run: vp i

      - name: Build demo
        run: vp run demo:build

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: packages/typodown/dist-demo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
