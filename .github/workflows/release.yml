name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_PATH: apps/typodown-app
  VITE_PLUS_VERSION: "0.2.0"

jobs:
  # Create a draft GitHub release with the generated changelog. Build jobs
  # attach their artifacts to it, then it is published once everything is done.
  # Skipped on manual runs (workflow_dispatch): those are dry runs that only
  # build artifacts and upload them to the workflow run, without a release.
  create-release:
    name: 🏷️ Create draft release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4.8.0
        id: git-cliff
        with:
          config: github
          args: -vv --latest --strip header
        env:
          OUTPUT: CHANGES.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create draft release
        id: create
        uses: softprops/action-gh-release@v3.0.1
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: CHANGES.md

  # Build desktop bundles for macOS (arm64 + x86_64), Linux and Windows.
  build-desktop:
    name: 🖥️ Build desktop (${{ matrix.label }})
    needs: create-release
    # Run on tag pushes (release_id set) and on manual dry runs (create-release skipped).
    if: ${{ always() && needs.create-release.result != 'failure' && needs.create-release.result != 'cancelled' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            platform: macos-latest
            rust_targets: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - label: macOS x86_64
            platform: macos-latest
            rust_targets: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          - label: Linux x86_64
            platform: ubuntu-22.04
            rust_targets: x86_64-unknown-linux-gnu
            args: ""
          - label: Windows x86_64
            platform: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            args: ""
          # TODO: add linux arm64 and windows arm64 once tauri-action supports them
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.APP_PATH }}/src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Install Vite+
        run: npm install -g vite-plus@${{ env.VITE_PLUS_VERSION }}

      - name: Install dependencies
        run: vp i

      # On a tag push releaseId is set, so bundles are uploaded to the draft
      # release. On a dry run releaseId is empty, so tauri-action only builds
      # and exposes the paths via its artifactPaths output.
      - name: Build desktop bundles
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ${{ env.APP_PATH }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

      - name: Stage bundles for upload (dry run)
        if: needs.create-release.outputs.release_id == ''
        shell: bash
        run: |
          mkdir -p dist-artifacts
          echo '${{ steps.tauri.outputs.artifactPaths }}' | jq -r '.[]' | while read -r p; do
            cp -r "$p" dist-artifacts/
          done

      - name: Upload bundles to workflow run (dry run)
        if: needs.create-release.outputs.release_id == ''
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.rust_targets }}
          path: dist-artifacts/*
          if-no-files-found: error

  # Build a signed universal Android APK.
  build-android:
    name: 📱 Build signed Android APK
    needs: create-release
    # Run on tag pushes (release_id set) and on manual dry runs (create-release skipped).
    if: ${{ always() && needs.create-release.result != 'failure' && needs.create-release.result != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5.5.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.APP_PATH }}/src-tauri

      - name: Install Vite+
        run: npm install -g vite-plus@${{ env.VITE_PLUS_VERSION }}

      - name: Install dependencies
        run: vp i

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/typodown.jks"

      - name: Write keystore.properties
        working-directory: ${{ env.APP_PATH }}/src-tauri/gen/android
        run: |
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/typodown.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build signed APK
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_ROOT }}
        run: npm run tauri android build -- --apk
        working-directory: ${{ env.APP_PATH }}

      - name: Upload APK to release
        if: needs.create-release.outputs.release_id != ''
        uses: softprops/action-gh-release@v3.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ env.APP_PATH }}/src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk

      - name: Upload APK to workflow run (dry run)
        if: needs.create-release.outputs.release_id == ''
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ env.APP_PATH }}/src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
          if-no-files-found: error

  # Publish the release once every artifact has been attached.
  publish-release:
    name: ✅ Publish release
    needs: [create-release, build-desktop, build-android]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Publish
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false,
            });
