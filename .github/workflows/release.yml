name: Release
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_PATH: apps/typodown-app

jobs:
  # Create a draft GitHub release with the generated changelog. Build jobs
  # attach their artifacts to it, then it is published once everything is done.
  # Skipped on manual runs (workflow_dispatch): those are dry runs that only
  # build artifacts and upload them to the workflow run, without a release.
  create-release:
    name: 🏷️ Create draft release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4.8.0
        id: git-cliff
        with:
          config: github
          args: -vv --latest --strip header
        env:
          OUTPUT: CHANGES.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create draft release
        id: create
        uses: softprops/action-gh-release@v3.0.1
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: CHANGES.md

  # Build desktop bundles for macOS (arm64 + x86_64), Linux and Windows.
  build-desktop:
    name: 🖥️ Build desktop (${{ matrix.label }})
    needs: create-release
    # Run on tag pushes (release_id set) and on manual dry runs (create-release skipped).
    if: ${{ always() && needs.create-release.result != 'failure' && needs.create-release.result != 'cancelled' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            platform: macos-latest
            rust_targets: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
            asset_name: Typodown-macos-arm64[setup][ext]
          - label: macOS x86_64
            platform: macos-latest
            rust_targets: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
            asset_name: Typodown-macos-x64[setup][ext]
          - label: Linux x86_64
            platform: ubuntu-22.04
            rust_targets: x86_64-unknown-linux-gnu
            args: ""
            asset_name: Typodown-linux-x64[setup][ext]
          - label: Windows x86_64
            platform: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            args: ""
            asset_name: Typodown-windows-x64[setup][ext]
          # TODO: add linux arm64 and windows arm64 once tauri-action supports them
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "lts"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.APP_PATH }}/src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Install dependencies
        run: vp i

      # On a tag push releaseId is set, so bundles are uploaded to the draft
      # release. Workflow artifacts are also kept for manual dry runs.
      - name: Build desktop bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ${{ env.APP_PATH }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          assetNamePattern: ${{ matrix.asset_name }}
          args: ${{ matrix.args }}

      - name: Upload bundles to workflow run (dry run)
        if: needs.create-release.outputs.release_id == ''
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.rust_targets }}
          path: |
            ${{ env.APP_PATH }}/src-tauri/target/**/release/bundle/**/*.dmg
            ${{ env.APP_PATH }}/src-tauri/target/**/release/bundle/**/*.msi
            ${{ env.APP_PATH }}/src-tauri/target/**/release/bundle/**/*-setup.exe
            ${{ env.APP_PATH }}/src-tauri/target/**/release/bundle/**/*.AppImage
            ${{ env.APP_PATH }}/src-tauri/target/**/release/bundle/**/*.deb
            ${{ env.APP_PATH }}/src-tauri/target/**/release/bundle/**/*.rpm
          if-no-files-found: error

  # Build a signed universal Android APK.
  build-android:
    name: 📱 Build & publish Android
    needs: create-release
    # Run on tag pushes (release_id set) and on manual dry runs (create-release skipped).
    if: ${{ always() && needs.create-release.result != 'failure' && needs.create-release.result != 'cancelled' }}
    runs-on: ubuntu-latest
    env:
      # Publish to Play only when the service-account secret is configured, so
      # the release still succeeds for forks / before Play is set up.
      HAS_PLAY_CREDS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
      AAB_PATH: apps/typodown-app/src-tauri/gen/android/app/build/outputs/bundle/universalRelease/app-universal-release.aab
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "lts"

      - name: Setup Java
        uses: actions/setup-java@v5.5.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;27.2.12479018"
          td_ndk_home="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          test -f "$td_ndk_home/source.properties"
          echo "NDK_HOME=$td_ndk_home" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$td_ndk_home" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.APP_PATH }}/src-tauri

      - name: Install dependencies
        run: vp i

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/typodown.jks"

      - name: Write keystore.properties
        working-directory: ${{ env.APP_PATH }}/src-tauri/gen/android
        run: |
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/typodown.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EOF

      # Play requires a unique, increasing versionCode per upload. Tauri derives
      # it from tauri.conf.json `version` (major*1000000 + minor*1000 + patch),
      # so sync that version to the release tag. `bumpp` only bumps package.json.
      - name: Sync app version from tag
        if: github.ref_type == 'tag'
        working-directory: ${{ env.APP_PATH }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs'),f='src-tauri/tauri.conf.json',c=require('./'+f);c.version='$v';fs.writeFileSync(f,JSON.stringify(c,null,2)+'\n')"
          echo "Set Android app version to $v"

      - name: Build signed APK and AAB
        run: npm run tauri android build -- --apk --aab
        working-directory: ${{ env.APP_PATH }}

      - name: Stage Android release asset
        run: |
          mkdir -p dist-artifacts
          cp "${{ env.APP_PATH }}"/src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk \
            dist-artifacts/Typodown-android.apk

      - name: Upload APK to release
        if: needs.create-release.outputs.release_id != ''
        uses: softprops/action-gh-release@v3.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: dist-artifacts/Typodown-android.apk

      - name: Upload APK + AAB to workflow run (dry run)
        if: needs.create-release.outputs.release_id == ''
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            dist-artifacts/Typodown-android.apk
            ${{ env.AAB_PATH }}
          if-no-files-found: error

      # Publishes the AAB to the Play Console's "internal" testing track. The
      # first upload of a package must be done manually in the Play Console
      # (see CONTRIBUTING.md); the API cannot create the app listing. Promote
      # from internal -> production in the Play Console when ready.
      - name: Publish to Google Play (internal track)
        if: ${{ needs.create-release.outputs.release_id != '' && env.HAS_PLAY_CREDS == 'true' }}
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.vemonet.typodown
          releaseFiles: ${{ env.AAB_PATH }}
          track: internal
          status: completed
          mappingFile: ${{ env.APP_PATH }}/src-tauri/gen/android/app/build/outputs/mapping/universalRelease/mapping.txt

      - name: Note when Play publish is skipped
        if: ${{ needs.create-release.outputs.release_id != '' && env.HAS_PLAY_CREDS != 'true' }}
        run: echo "::notice::PLAY_SERVICE_ACCOUNT_JSON not set · skipped Google Play upload. APK is on the GitHub release."

  # Build an unsigned iOS .ipa.
  #
  # There is no Apple Developer account behind this repo, so the archive is
  # exported with `--no-sign`: the resulting .ipa cannot be installed by
  # double-clicking and has to be re-signed first (Sideloadly, AltStore, or a
  # local Xcode run). It is published so iOS users have something to sideload,
  # not as an App Store / TestFlight build.
  #
  # Unlike gen/android, gen/apple is not committed: generating it needs Xcode,
  # so the Xcode project is created on the fly by `tauri ios init`.
  build-ios:
    name: 🍎 Build iOS (unsigned)
    needs: create-release
    # Run on tag pushes (release_id set) and on manual dry runs (create-release skipped).
    if: ${{ always() && needs.create-release.result != 'failure' && needs.create-release.result != 'cancelled' }}
    # The app has never shipped on iOS and this artifact is a bonus rather than a
    # release blocker, so a failure here must not hold back the release. Dependent
    # jobs still run (that is what continue-on-error means for `needs`).
    continue-on-error: true
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "lts"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.APP_PATH }}/src-tauri

      # cargo-mobile2 (which drives `tauri ios init`) generates the Xcode project
      # through XcodeGen. CocoaPods is already on the runner image.
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install dependencies
        run: vp i

      # Same reason as Android: the bundle's short version string comes from
      # tauri.conf.json `version`, which `bumpp` does not touch.
      - name: Sync app version from tag
        if: github.ref_type == 'tag'
        working-directory: ${{ env.APP_PATH }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs'),f='src-tauri/tauri.conf.json',c=require('./'+f);c.version='$v';fs.writeFileSync(f,JSON.stringify(c,null,2)+'\n')"
          echo "Set iOS app version to $v"

      - name: Generate the Xcode project
        run: npm run tauri ios init -- --ci
        working-directory: ${{ env.APP_PATH }}

      # `--archive-only` stops before the export step, which is the part that
      # insists on a signing identity, and leaves a plain .xcarchive behind.
      - name: Build unsigned archive
        run: npm run tauri ios build -- --no-sign --archive-only
        working-directory: ${{ env.APP_PATH }}

      # An .ipa is just a zip with the .app under `Payload/`, so the archive's
      # unsigned app bundle can be packaged by hand.
      - name: Package the archive as an unsigned .ipa
        working-directory: ${{ env.APP_PATH }}
        run: |
          set -euo pipefail
          archive=$(find src-tauri/gen/apple/build -name '*.xcarchive' | head -1)
          if [ -z "$archive" ]; then
            echo "::error::No .xcarchive found under src-tauri/gen/apple/build"
            find src-tauri/gen/apple/build -maxdepth 3 || true
            exit 1
          fi
          app=$(find "$archive/Products/Applications" -maxdepth 1 -name '*.app' | head -1)
          out="$GITHUB_WORKSPACE/dist-artifacts/Typodown-ios-unsigned.ipa"
          mkdir -p "$(dirname "$out")"
          staging=$(mktemp -d)
          mkdir "$staging/Payload"
          cp -R "$app" "$staging/Payload/"
          (cd "$staging" && zip -qry "$out" Payload)
          ls -lh "$out"

      - name: Upload .ipa to release
        if: needs.create-release.outputs.release_id != ''
        uses: softprops/action-gh-release@v3.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: dist-artifacts/*.ipa

      - name: Upload .ipa to workflow run (dry run)
        if: needs.create-release.outputs.release_id == ''
        uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist-artifacts/*.ipa
          if-no-files-found: error

  # Publish the release once every artifact has been attached.
  publish-release:
    name: ✅ Publish release
    needs: [create-release, build-desktop, build-android, build-ios]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Publish
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false,
            });
