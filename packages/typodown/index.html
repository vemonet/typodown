    <style>
      * {

        --page-fg: #1f2328;

      }
      :root[data-theme="dark"] {

        --page-fg: #e6edf3;
        --page-border: #3d444d;
      }

        :root[data-theme="auto"] {

          --page-fg: #e6edf3;

        }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--page-bg);
        color: var(--page-fg);

      main {
        flex: 1;
        width: min(860px, 100%);

        padding: 0 1rem;

      /* Let the editor blend into the page rather than look like a white card;

      #editor .cm-editor {
        background: transparent;

      .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.75rem 1.25rem;
        border-bottom: 1px solid var(--page-border);

      }
      .brand {

        gap: 0.75rem;

  <body>
    <header class="bar">
      <div class="brand">
        <img src="/logo.png" width="28" height="28" alt="" aria-hidden="true" />
        <strong>Typodown</strong>
        <span
          >Open source WYSIWYG markdown editor &middot; syntax reveals on the construct under the
          cursor</span
        >
      </div>
      <div class="actions">
        <label class="theme">
          Theme
          <select id="theme">
            <option value="auto">Auto</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </label>
        <a
          class="github"
          href="https://github.com/vemonet/typodown"
          target="_blank"
          rel="noopener"
          aria-label="GitHub repository"
        >
          <svg viewBox="0 0 16 16" width="20" height="20" aria-hidden="true">
            <path
              fill="currentColor"
              d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"

    <main id="editor"></main>

    <script type="module">
      import { createTypodown } from "/src/index.ts";
      import "/src/theme.css";

      const SAMPLE = `---
type: Articles
---

# Typodown

A **Typora-like** WYSIWYG editor for **GitHub Flavored Markdown**, built on _CodeMirror 6_. Put your cursor on any styled text and its raw \`markdown\` syntax appears, just like Typora. Write each paragraph on one line and let it wrap: a single newline stays on the same paragraph, a blank line starts a new one.

## Inline formatting

Write **bold**, _italic_, ***bold italic***, ~~strikethrough~~ and \`inline code\`. Backslash escapes work too: \\*not emphasized\\*. Links can be [inline](https://github.com/vemonet/typodown), autolinks like <https://viteplus.dev>, or an email such as <hello@example.com>.

Select some text and press <kbd>cmd/ctrl</kbd> + <kbd>B</kbd>, <kbd>cmd/ctrl</kbd> + <kbd>I</kbd>, or <kbd>cmd/ctrl</kbd> + <kbd>K</kbd> (copy a URL first) to format it.

## Headings

# Heading level 1
## Heading level 2
### Heading level 3
#### Heading level 4
##### Heading level 5
###### Heading level 6

## Lists

Unordered lists nest with different bullets per level (Tab / Shift+Tab):

- Fruit
  - Apple
  - Banana
    - Cavendish
- Vegetables

Ordered lists keep their starting number:

3. Third item
4. Fourth item
5. Fifth item

Task lists stay interactive:

- [x] Parse GitHub Flavored Markdown
- [x] Reveal the syntax under the cursor
- [ ] Create new JS framework

## Blockquotes and alerts

> A plain blockquote.
> It can span several lines.

> [!NOTE]
> Useful information that users should know, even when skimming.

> [!TIP]
> Helpful advice for doing things better or more easily.

> [!IMPORTANT]
> Key information users need to know to achieve their goal.

> [!WARNING]
> Urgent info that needs immediate user attention to avoid problems.

> [!CAUTION]
> Advises about risks or negative outcomes of certain actions.

## Table

Columns can be left, center, or right aligned:

| Feature     | Supported | Notes                       |
| :---------- | :-------: | --------------------------: |
| Headings    |    yes    | \`#\` through \`######\`        |
| Emphasis    |    yes    | bold, italic, strikethrough |
| Code blocks |    yes    | syntax highlighted          |
| Tables      |    yes    | with column alignment       |

## Code blocks

TypeScript:

\`\`\`ts
import { createTypodown } from "@vemonet/typodown";
import "@vemonet/typodown/style.css";

const editor = createTypodown(document.getElementById("app")!, {
  value: "# Hello",
  theme: "auto", // "light" | "dark" | "auto"
  placeholder: "Write some markdown...",
  onChange: (markdown) => console.log(markdown),
});
\`\`\`

Python:

\`\`\`python
def fib(n: int) -> int:
    return n if n < 2 else fib(n - 1) + fib(n - 2)
\`\`\`

Shell:

\`\`\`bash
npm install @vemonet/typodown
vp dev   # start this demo
\`\`\`

SPARQL:

\`\`\`sparql
PREFIX foaf: <http://xmlns.com/foaf/0.1/>
SELECT ?name ?email WHERE {
  ?person a foaf:Person ;
          foaf:name ?name ;
          foaf:mbox ?email .
  FILTER(CONTAINS(?name, "Ada"))
}
ORDER BY ?name
LIMIT 10
\`\`\`

## Mermaid diagrams

Fenced code blocks with the \`mermaid\` language render as live diagrams when idle, and reveal their raw source when you click into them:

\`\`\`mermaid
flowchart LR
  A[Write markdown] --> B{Cursor on it?}
  B -- yes --> C[Show raw syntax]
  B -- no --> D[Render live preview]
\`\`\`

## LaTeX maths

Inline maths like $f = \\frac{2\\pi}{T}$ and $E = mc^2$ renders with KaTeX, and reveals its raw \`$...$\` source when you click into it. Block maths with \`$$\` renders centred on its own line:

$$
\\int_{-\\infty}^{\\infty} e^{-x^2}\\,dx = \\sqrt{\\pi}
$$

Single-line block maths works too: $$\\sum_{n=1}^{\\infty} \\frac{1}{n^2} = \\frac{\\pi^2}{6}$$

## Image

![MIT licensed](https://img.shields.io/badge/license-MIT-blue)

## Raw HTML

Raw HTML renders in place, and reveals its dimmed source when the caret lands on it, just like markdown syntax. It is on by default; pass **html: false** to turn it off.

<div style="padding: 12px; border-left: 3px solid var(--td-link); background: var(--td-block-bg); border-radius: 0 6px 6px 0;">
  <strong>Custom callout</strong> built from a block of inline-styled HTML.
</div>

<details>
  <summary>Collapsible section (click to expand)</summary>
  Hidden content inside a native <code>details</code> element.
</details>

Inline HTML like <kbd>Ctrl</kbd> + <kbd>K</kbd>, <span style="color: var(--td-caution);">colored text</span>, subscript H<sub>2</sub>O, and <small>small print</small> all work too.

---

Everything above is driven from a single markdown string. Edit freely and the source stays in sync.
      `;

      const editor = createTypodown(document.getElementById("editor"), {
        value: SAMPLE,
        theme: "auto",
        placeholder: "Write some markdown...",
      });

      const applyTheme = (theme) => {
        editor.setTheme(theme);
        document.documentElement.dataset.theme = theme;
      };
      const select = document.getElementById("theme");
      select.addEventListener("change", () => applyTheme(select.value));
      applyTheme(select.value);

      editor.focus();
    </script>
  </body>
