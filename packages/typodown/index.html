<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo.png" />

    <title>Typodown · WYSIWYG Markdown editor for the web</title>
    <meta
      name="description"
      content="Typodown is a fast, open source, zero-dependency WYSIWYG Markdown editor for the web. It renders GitHub Flavored Markdown inline and reveals the raw syntax on the block under your cursor, just like Typora."
    />
    <meta
      name="keywords"
      content="markdown editor, WYSIWYG, GitHub Flavored Markdown, GFM, Typora, contenteditable, TypeScript, rich text editor"
    />
    <meta name="author" content="Vincent Emonet" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0d1117" />
    <link rel="canonical" href="https://vemonet.github.io/typodown/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Typodown" />
    <meta property="og:title" content="Typodown · WYSIWYG Markdown editor for the web" />
    <meta
      property="og:description"
      content="A fast, open source, zero-dependency WYSIWYG Markdown editor that renders GitHub Flavored Markdown inline and reveals the raw syntax on the block under your cursor."
    />
    <meta property="og:url" content="https://vemonet.github.io/typodown/" />
    <meta property="og:image" content="https://vemonet.github.io/typodown/logo-hq.png" />
    <meta property="og:image:alt" content="Typodown logo" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Typodown · WYSIWYG Markdown editor for the web" />
    <meta
      name="twitter:description"
      content="A fast, open source, zero-dependency WYSIWYG Markdown editor that renders GitHub Flavored Markdown inline and reveals the raw syntax on the block under your cursor."
    />
    <meta name="twitter:image" content="https://vemonet.github.io/typodown/logo-hq.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Typodown",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Web",
        "url": "https://vemonet.github.io/typodown/",
        "description": "A fast, open source, zero-dependency WYSIWYG Markdown editor for the web that renders GitHub Flavored Markdown inline and reveals the raw syntax on the block under your cursor.",
        "author": { "@type": "Person", "name": "Vincent Emonet" },
        "license": "https://opensource.org/licenses/MIT",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>
  <body>
    <header class="bar">
      <div class="brand">
        <img src="/logo.png" width="28" height="28" alt="" aria-hidden="true" />
        <strong>Typodown</strong>
        <span
          >Open source WYSIWYG markdown editor &middot; syntax reveals on the construct under the
          cursor</span
        >
      </div>
      <div class="actions">
        <label class="theme">
          Theme
          <select id="theme">
            <option value="auto">Auto</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </label>
        <a
          class="github"
          href="https://github.com/vemonet/typodown"
          target="_blank"
          rel="noopener"
          aria-label="GitHub repository"
        >
          <svg viewBox="0 0 16 16" width="20" height="20" aria-hidden="true">
            <path
              fill="currentColor"
              d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"
            />
          </svg>
        </a>
      </div>
    </header>
    <main id="editor"></main>
    <script type="module" src="/demo/main.ts"></script>
  </body>
</html>
